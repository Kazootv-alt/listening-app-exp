# 週1回の自動ボトルネック監査（Gemini・無料枠）。直近2週間の変更とIssueを見て、開発の詰まりを Issue に書く。鍵が無ければ何もしない。
name: 週1回のボトルネック監査
on:
  schedule:
    - cron: '17 21 * * 0'   # 毎週月曜 6:17（日本時間）
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gemini に監査してもらう
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_MODE: audit
        run: python3 tools/gemini_review.py
